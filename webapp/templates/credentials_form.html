<!DOCTYPE html>
<html>
<head>
  <title>{{ broker_name }} credentials</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; }
    input { display: block; width: 100%; padding: 8px; margin: 6px 0 16px; box-sizing: border-box; }
    label { font-weight: 600; }
    button { padding: 8px 16px; }
    .hint { font-size: 0.85em; color: #888; }
  </style>
</head>
<body>
  <p><a href="{{ url_for('dashboard') }}">&larr; Back to dashboard</a></p>
  <h2>{{ broker_name }} credentials</h2>
  <p class="hint">Stored encrypted in the local vault — never written to .env.</p>
  <form method="post">
    {% for field_name, label, is_secret in fields_spec %}
      <label>{{ label }}</label>
      <input
        type="{{ 'password' if is_secret else 'text' }}"
        name="{{ field_name }}"
        value="{{ '' if is_secret else existing.get(field_name, '') }}"
        {% if is_secret and existing.get(field_name) %}placeholder="(unchanged — leave blank to keep current value)"{% endif %}
      >
    {% endfor %}
    <button type="submit">Save</button>
  </form>
</body>
</html>
