<!DOCTYPE html>
<html>
<head>
  <title>liquidity-sweep-bot — Register</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 80px auto; }
    input { display: block; width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
    button { padding: 8px 16px; }
    .error { color: #b00020; white-space: pre-wrap; }
    .hint { font-size: 0.85em; color: #888; }
  </style>
</head>
<body>
  <h2>Register a new account</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required minlength="8">
    <p class="hint">At least 8 characters.</p>
    <label>Confirm password</label>
    <input type="password" name="confirm_password" required minlength="8">
    <button type="submit">Register</button>
  </form>
  <p><a href="{{ url_for('login') }}">Already have an account? Log in</a></p>
</body>
</html>
