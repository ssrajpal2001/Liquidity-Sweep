<!DOCTYPE html>
<html>
<head>
  <title>liquidity-sweep-bot — Logs</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 20px auto; padding: 0 16px; }
    pre { background: #111; color: #ddd; padding: 16px; border-radius: 6px; height: 70vh; overflow-y: auto;
          font-family: "SF Mono", Consolas, monospace; font-size: 0.82em; white-space: pre-wrap; word-break: break-all; }
    .tag { color: #7dd3fc; }
    a.back { text-decoration: none; color: #222; }
    .controls { margin: 10px 0; font-size: 0.85em; color: #666; }
    label { margin-right: 16px; }
  </style>
</head>
<body>
  <p><a class="back" href="{{ url_for('dashboard') }}">&larr; Back to dashboard</a></p>
  <h2>Logs</h2>
  <div class="controls">
    <label><input type="checkbox" id="autoscroll" checked> Auto-scroll</label>
    <label><input type="checkbox" id="autorefresh" checked> Auto-refresh (5s)</label>
    <span id="last-updated"></span>
  </div>
  <pre id="log-body">Loading...</pre>

  <script>
    const body = document.getElementById('log-body');
    const autoscroll = document.getElementById('autoscroll');
    const autorefresh = document.getElementById('autorefresh');
    const lastUpdated = document.getElementById('last-updated');

    function refresh() {
      fetch('/logs/tail').then(r => r.json()).then(data => {
        body.textContent = data.lines.join('\n');
        if (autoscroll.checked) body.scrollTop = body.scrollHeight;
        lastUpdated.textContent = 'Updated ' + new Date().toLocaleTimeString();
      }).catch(() => {
        lastUpdated.textContent = 'Refresh failed — will retry.';
      });
    }

    refresh();
    setInterval(() => { if (autorefresh.checked) refresh(); }, 5000);
  </script>
</body>
</html>
