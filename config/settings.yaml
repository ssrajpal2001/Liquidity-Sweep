# =============================================================================
# liquidity-sweep-bot — settings.yaml
# Non-secret runtime configuration. Secrets (API keys, tokens) live in .env
# and are NEVER put in this file. See .env.example for the secret template.
# =============================================================================

app:
  name: "liquidity-sweep-bot"
  environment: "paper"         # paper | live — mirrors PAPER_MODE in .env
  timezone: "Asia/Kolkata"

capital:
  total_capital_inr: 200000
  risk_per_trade_pct: 1.0      # % of capital risked per trade
  max_daily_loss_pct: 3.0      # hard stop for the day
  max_trades_per_day: 3

# spot_key is the Fyers symbol format (NOT Upstox's instrument_key format).
# NIFTY/SENSEX values below are the standard Fyers index symbols — double
# check against Fyers' symbol master (https://public.fyers.in/sym_details/)
# if either ever fails to subscribe.
instruments:
  - name: "NIFTY"
    spot_key: "NSE:NIFTY50-INDEX"
    lot_size: 75
    strike_interval: 50        # points between listed strikes
  - name: "SENSEX"
    spot_key: "BSE:SENSEX-INDEX"
    lot_size: 20
    strike_interval: 100

timeframes:
  htf_minutes: 75               # rolling base / major levels
  itf_minutes: 15                # structure shifts (MSS/CHoCH)
  ltf_minutes: [3, 5]            # entry trigger candles

session:
  market_open: "09:15"
  market_close: "15:30"
  high_probability_windows:
    - ["09:15", "10:30"]         # opening liquidity sweeps
    - ["13:15", "14:45"]         # afternoon institutional re-alignment
  blocked_window:
    - ["11:30", "13:00"]         # lunch-hour chop — signals ignored

option_selection:
  target_delta_min: 0.50
  target_delta_max: 0.60
  delta_cache_refresh_seconds: 120   # also refresh on strike-interval spot move

execution:
  order_type: "LIMIT"                # never MARKET during sweeps
  limit_offset_rupees: 1.5           # priced above ask on buy side
  target1_rr: 1.5                    # risk:reward for partial booking
  target1_booking_pct: 60            # % of position closed at Target 1

risk:
  sweep_buffer_points:
    NIFTY: 4
    SENSEX: 10
  atr_displacement_multiplier: 1.5   # displacement candle body must exceed this x ATR
  trail_distance_points: 5.0          # TSL: trails this many premium points behind best price seen, after Target 1

logging:
  level: "INFO"
  log_dir: "logs"
